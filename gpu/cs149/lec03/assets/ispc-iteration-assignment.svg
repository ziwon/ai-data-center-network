<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Interleaved and blocked ISPC iteration assignment</title>
  <desc id="desc">Interleaved assignment produces contiguous addresses across SIMD lanes at each time step, while blocked assignment produces strided addresses and may require a gather.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .frame { fill: none; stroke: #111111; stroke-width: 2; }
    .cell { fill: none; stroke: #D8D1C7; stroke-width: 1.5; }
    .active { fill: #D9392E; stroke: #D9392E; stroke-width: 1.5; }
    .line { fill: none; stroke: #111111; stroke-width: 2; }
    .dash { fill: none; stroke: #6F6A63; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .text { fill: #050505; font-family: Inter, Arial, sans-serif; font-size: 16px; }
    .label { fill: #050505; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .small { fill: #6F6A63; font-family: Inter, Arial, sans-serif; font-size: 14px; }
    .white { fill: #F5F1EA; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; }
    .key { fill: #D9392E; font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; }
  </style>

  <rect class="bg" width="1120" height="540"/>

  <text class="label" x="55" y="55">Interleaved assignment</text>
  <text class="small" x="55" y="80">At one SIMD step, lanes touch adjacent addresses.</text>
  <text class="small" x="55" y="124">step</text>

  <g transform="translate(125 100)">
    <rect class="frame" x="0" y="0" width="880" height="120"/>
    <line class="dash" x1="0" y1="60" x2="880" y2="60"/>
    <text class="text" x="-25" y="36">0</text>
    <text class="text" x="-25" y="96">1</text>

    <g>
      <rect class="active" x="20" y="16" width="88" height="28"/>
      <rect class="active" x="128" y="16" width="88" height="28"/>
      <rect class="active" x="236" y="16" width="88" height="28"/>
      <rect class="active" x="344" y="16" width="88" height="28"/>
      <rect class="active" x="452" y="16" width="88" height="28"/>
      <rect class="active" x="560" y="16" width="88" height="28"/>
      <rect class="active" x="668" y="16" width="88" height="28"/>
      <rect class="active" x="776" y="16" width="84" height="28"/>
      <text class="white" x="58" y="36">0</text>
      <text class="white" x="166" y="36">1</text>
      <text class="white" x="274" y="36">2</text>
      <text class="white" x="382" y="36">3</text>
      <text class="white" x="490" y="36">4</text>
      <text class="white" x="598" y="36">5</text>
      <text class="white" x="706" y="36">6</text>
      <text class="white" x="812" y="36">7</text>
    </g>

    <g>
      <rect class="cell" x="20" y="76" width="88" height="28"/>
      <rect class="cell" x="128" y="76" width="88" height="28"/>
      <rect class="cell" x="236" y="76" width="88" height="28"/>
      <rect class="cell" x="344" y="76" width="88" height="28"/>
      <rect class="cell" x="452" y="76" width="88" height="28"/>
      <rect class="cell" x="560" y="76" width="88" height="28"/>
      <rect class="cell" x="668" y="76" width="88" height="28"/>
      <rect class="cell" x="776" y="76" width="84" height="28"/>
      <text class="text" x="52" y="96">8</text>
      <text class="text" x="158" y="96">9</text>
      <text class="text" x="264" y="96">10</text>
      <text class="text" x="372" y="96">11</text>
      <text class="text" x="480" y="96">12</text>
      <text class="text" x="588" y="96">13</text>
      <text class="text" x="696" y="96">14</text>
      <text class="text" x="804" y="96">15</text>
    </g>
  </g>
  <text class="key" x="430" y="247">packed vector load</text>
  <path class="line" d="M370 238 H420"/>
  <path class="line" d="M620 238 H670"/>

  <text class="label" x="55" y="315">Blocked assignment</text>
  <text class="small" x="55" y="340">At one SIMD step, lanes touch distant addresses.</text>
  <text class="small" x="55" y="384">step</text>

  <g transform="translate(125 360)">
    <rect class="frame" x="0" y="0" width="880" height="100"/>
    <text class="text" x="-25" y="34">0</text>
    <text class="text" x="-25" y="78">1</text>

    <rect class="active" x="20" y="16" width="88" height="28"/>
    <rect class="active" x="128" y="16" width="88" height="28"/>
    <rect class="active" x="236" y="16" width="88" height="28"/>
    <rect class="active" x="344" y="16" width="88" height="28"/>
    <rect class="active" x="452" y="16" width="88" height="28"/>
    <rect class="active" x="560" y="16" width="88" height="28"/>
    <rect class="active" x="668" y="16" width="88" height="28"/>
    <rect class="active" x="776" y="16" width="84" height="28"/>
    <text class="white" x="58" y="36">0</text>
    <text class="white" x="158" y="36">8</text>
    <text class="white" x="264" y="36">16</text>
    <text class="white" x="372" y="36">24</text>
    <text class="white" x="480" y="36">32</text>
    <text class="white" x="588" y="36">40</text>
    <text class="white" x="696" y="36">48</text>
    <text class="white" x="804" y="36">56</text>

    <rect class="cell" x="20" y="58" width="88" height="28"/>
    <rect class="cell" x="128" y="58" width="88" height="28"/>
    <rect class="cell" x="236" y="58" width="88" height="28"/>
    <rect class="cell" x="344" y="58" width="88" height="28"/>
    <rect class="cell" x="452" y="58" width="88" height="28"/>
    <rect class="cell" x="560" y="58" width="88" height="28"/>
    <rect class="cell" x="668" y="58" width="88" height="28"/>
    <rect class="cell" x="776" y="58" width="84" height="28"/>
    <text class="text" x="58" y="78">1</text>
    <text class="text" x="158" y="78">9</text>
    <text class="text" x="264" y="78">17</text>
    <text class="text" x="372" y="78">25</text>
    <text class="text" x="480" y="78">33</text>
    <text class="text" x="588" y="78">41</text>
    <text class="text" x="696" y="78">49</text>
    <text class="text" x="804" y="78">57</text>
  </g>

  <path class="line" d="M370 486 H455"/>
  <path class="line" d="M665 486 H750"/>
  <text class="key" x="470" y="492">gather may be required</text>
</svg>
