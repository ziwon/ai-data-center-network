<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 architecture</title>
  <desc id="desc">Dense technical diagram of the Kimi K3 backbone, Block Attention Residuals, Kimi Delta Attention, Stable LatentMoE, Gated MLA, and MoonViT-V2 vision path using official released dimensions.</desc>
  <style>
    .bg { fill: #F3EFE7; }
    .panel { fill: none; stroke: #111111; stroke-width: 2; stroke-dasharray: 10 7; rx: 14; }
    .panel-subtle { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 2; rx: 10; }
    .node { fill: #F5F1EA; stroke: #111111; stroke-width: 1.8; rx: 8; }
    .node-soft { fill: #E7E0D6; stroke: #111111; stroke-width: 1.6; rx: 8; }
    .node-dark { fill: #111111; stroke: #111111; stroke-width: 1.6; rx: 8; }
    .node-accent { fill: #D9392E; stroke: #111111; stroke-width: 1.6; rx: 8; }
    .line { fill: none; stroke: #111111; stroke-width: 1.7; marker-end: url(#arrow); }
    .line-plain { fill: none; stroke: #111111; stroke-width: 1.7; }
    .line-dashed { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    .divider { stroke: #D8D1C7; stroke-width: 2; stroke-dasharray: 4 6; }
    .title { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 24px; font-weight: 700; font-style: normal; fill: #050505; }
    .subtitle { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 18px; font-weight: 700; font-style: normal; fill: #050505; }
    .label { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; font-weight: 600; font-style: normal; fill: #050505; }
    .label-white { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; font-weight: 600; font-style: normal; fill: #F5F1EA !important; }
    .small { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14px; font-weight: 400; font-style: normal; fill: #050505; }
    .tiny { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14px; font-weight: 400; font-style: normal; fill: #6F6A63; }
    .accent { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; font-weight: 700; font-style: normal; fill: #D9392E; }
    .number { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 22px; font-weight: 800; font-style: normal; fill: #050505; }
    .center { text-anchor: middle; dominant-baseline: middle; }
    .left { text-anchor: start; dominant-baseline: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F6A63"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1450"/>

  <!-- Block Attention Residuals -->
  <g aria-label="Block Attention Residuals">
    <rect class="panel" x="35" y="35" width="480" height="345"/>
    <text class="title left" x="55" y="65">Block Attention Residuals</text>
    <text class="tiny left" x="55" y="91">93 layers · block 12 · 8 blocks + embedding</text>

    <rect class="node-soft" x="55" y="120" width="75" height="40"/>
    <rect class="node-soft" x="145" y="120" width="75" height="40"/>
    <rect class="node-soft" x="235" y="120" width="75" height="40"/>
    <rect class="node-soft" x="325" y="120" width="75" height="40"/>
    <rect class="node-accent" x="415" y="120" width="75" height="40"/>
    <text class="small center" x="92.5" y="141">embed</text>
    <text class="small center" x="182.5" y="141">block 1</text>
    <text class="small center" x="272.5" y="141">block 2</text>
    <text class="small center" x="362.5" y="141">…</text>
    <text class="label-white center" style="fill:#F5F1EA" x="452.5" y="141">partial</text>

    <path class="line" d="M92 160 V193 H272 V213"/>
    <path class="line" d="M182 160 V188 H272 V213"/>
    <path class="line" d="M362 160 V188 H272 V213"/>
    <path class="line" d="M452 160 V193 H272 V213"/>
    <rect class="node" x="180" y="213" width="185" height="42"/>
    <text class="label center" x="272.5" y="234">stack + RMSNorm</text>

    <path class="line" d="M272 255 V278"/>
    <rect class="node" x="75" y="278" width="120" height="42"/>
    <rect class="node" x="220" y="278" width="105" height="42"/>
    <rect class="node" x="350" y="278" width="110" height="42"/>
    <text class="small center" x="135" y="299">layer query w</text>
    <text class="small center" x="272.5" y="299">softmax α</text>
    <text class="small center" x="405" y="299">weighted V</text>
    <path class="line" d="M195 299 H220"/>
    <path class="line" d="M325 299 H350"/>
    <path class="line-dashed" d="M272 255 V270 H405 V278"/>

    <path class="line" d="M405 320 V338"/>
    <text class="accent left" x="55" y="346">Selective retrieval across depth</text>
    <text class="tiny left" x="55" y="367">O(Nd) block state instead of O(Ld)</text>
  </g>

  <!-- KDA -->
  <g aria-label="Kimi Delta Attention">
    <rect class="panel" x="35" y="405" width="480" height="470"/>
    <text class="title left" x="55" y="435">Kimi Delta Attention</text>
    <text class="tiny left" x="55" y="457">69 layers · 96 heads · d_head 128 · Conv1d k=4</text>
    <text class="tiny left" x="55" y="477">channel-wise α/β gates · full-rank output gate</text>

    <rect class="node-dark" x="165" y="495" width="220" height="45"/>
    <text class="label-white center" style="fill:#F5F1EA" x="275" y="518">input x · hidden 7168</text>
    <path class="line" d="M275 540 V568"/>

    <rect class="node" x="65" y="568" width="90" height="45"/>
    <rect class="node" x="175" y="568" width="90" height="45"/>
    <rect class="node" x="285" y="568" width="90" height="45"/>
    <rect class="node" x="395" y="568" width="90" height="45"/>
    <text class="label center" x="110" y="591">Q</text>
    <text class="label center" x="220" y="591">K</text>
    <text class="label center" x="330" y="591">V</text>
    <text class="label center" x="440" y="591">α, β</text>
    <path class="line-plain" d="M275 568 V554 H110 V568"/>
    <path class="line-plain" d="M275 554 H220 V568"/>
    <path class="line-plain" d="M275 554 H330 V568"/>
    <path class="line-plain" d="M275 554 H440 V568"/>

    <path class="line" d="M110 613 V680 H190"/>
    <path class="line" d="M220 613 V665 H230 V680"/>
    <path class="line" d="M330 613 V665 H320 V680"/>
    <path class="line" d="M440 613 V680 H360"/>
    <rect class="node-accent" x="145" y="680" width="260" height="58"/>
    <text class="label-white center" style="fill:#F5F1EA" x="275" y="702">KDA recurrent update</text>
    <text class="label-white center" style="fill:#F5F1EA" x="275" y="722">Sₜ ∈ ℝ¹²⁸×¹²⁸ per head</text>

    <path class="line" d="M275 738 V765"/>
    <rect class="node" x="175" y="765" width="200" height="42"/>
    <text class="label center" x="275" y="786">head-wise RMSNorm</text>
    <path class="line" d="M275 807 V832"/>
    <rect class="node-dark" x="135" y="820" width="280" height="44"/>
    <text class="label-white center" style="fill:#F5F1EA" x="275" y="833">Sigmoid(Wg x) ⊙ RMSNorm</text>
    <text class="label-white center" style="fill:#F5F1EA" x="275" y="851">→ Linear O</text>

    <path class="line-dashed" d="M385 518 H500 V842 H415"/>
  </g>

  <!-- Backbone -->
  <g aria-label="Language model backbone">
    <rect class="panel" x="545" y="35" width="430" height="840"/>
    <text class="title left" x="565" y="65">Language model backbone</text>
    <text class="tiny left" x="565" y="87">2.78T total · 104.2B active · context 1,048,576</text>
    <text class="tiny left" x="565" y="106">vocab 163,840 · 93 layers</text>

    <rect class="node-dark" x="645" y="120" width="230" height="44"/>
    <text class="label-white center" style="fill:#F5F1EA" x="760" y="142">LM head</text>
    <path class="line" d="M760 195 V164"/>
    <rect class="node" x="645" y="195" width="230" height="44"/>
    <text class="label center" x="760" y="217">RMSNorm</text>

    <path class="line" d="M760 275 V239"/>
    <rect class="panel-subtle" x="595" y="275" width="330" height="102"/>
    <text class="subtitle left" x="615" y="301">Final layer 93</text>
    <rect class="node-accent" x="615" y="319" width="135" height="42"/>
    <rect class="node" x="770" y="319" width="135" height="42"/>
    <text class="label-white center" style="fill:#F5F1EA" x="682.5" y="340">Gated MLA</text>
    <text class="small center" x="837.5" y="340">Stable LatentMoE</text>

    <path class="line" d="M760 410 V377"/>
    <rect class="panel-subtle" x="575" y="410" width="370" height="365"/>
    <text class="number left" x="595" y="439">23× hybrid pattern</text>
    <text class="tiny left" x="595" y="462">layers 1–92 · each: 3 KDA + 1 Gated MLA</text>

    <rect class="node" x="605" y="490" width="145" height="46"/>
    <rect class="node" x="770" y="490" width="145" height="46"/>
    <text class="label center" x="677.5" y="513">KDA</text>
    <text class="small center" x="842.5" y="505">Stable LatentMoE*</text>
    <text class="tiny center" x="842.5" y="523">+ AttnRes</text>
    <path class="line" d="M750 513 H770"/>

    <rect class="node" x="605" y="555" width="145" height="46"/>
    <rect class="node" x="770" y="555" width="145" height="46"/>
    <text class="label center" x="677.5" y="578">KDA</text>
    <text class="small center" x="842.5" y="570">Stable LatentMoE</text>
    <text class="tiny center" x="842.5" y="588">+ AttnRes</text>
    <path class="line" d="M750 578 H770"/>

    <rect class="node" x="605" y="620" width="145" height="46"/>
    <rect class="node" x="770" y="620" width="145" height="46"/>
    <text class="label center" x="677.5" y="643">KDA</text>
    <text class="small center" x="842.5" y="635">Stable LatentMoE</text>
    <text class="tiny center" x="842.5" y="653">+ AttnRes</text>
    <path class="line" d="M750 643 H770"/>

    <rect class="node-accent" x="605" y="685" width="145" height="46"/>
    <rect class="node" x="770" y="685" width="145" height="46"/>
    <text class="label-white center" style="fill:#F5F1EA" x="677.5" y="708">Gated MLA</text>
    <text class="small center" x="842.5" y="700">Stable LatentMoE</text>
    <text class="tiny center" x="842.5" y="718">+ AttnRes</text>
    <path class="line" d="M750 708 H770"/>

    <text class="tiny left" x="595" y="756">* L1: dense FFN</text>
    <text class="tiny left" x="775" y="756">L2–93: Stable LatentMoE</text>
    <path class="line" d="M760 805 V731"/>
    <rect class="node-dark" x="600" y="805" width="320" height="46"/>
    <text class="label-white center" style="fill:#F5F1EA" x="760" y="828">shared embedding · 7168</text>
    <path class="line" d="M760 875 V851"/>
  </g>

  <!-- Stable LatentMoE -->
  <g aria-label="Stable LatentMoE">
    <rect class="panel" x="1005" y="35" width="760" height="365"/>
    <text class="title left" x="1025" y="65">Stable LatentMoE</text>
    <text class="tiny left" x="1025" y="91">896 routed experts · Top-16 · 2 shared experts · sigmoid router</text>

    <rect class="node-dark" x="1025" y="115" width="170" height="44"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1110" y="137">input x · 7168</text>

    <rect class="node-accent" x="1220" y="115" width="110" height="44"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1275" y="137">Router</text>
    <path class="line" d="M1195 137 H1220"/>

    <rect class="node" x="1350" y="115" width="125" height="44"/>
    <text class="label center" x="1412.5" y="137">Top-16 / 896</text>
    <path class="line" d="M1330 137 H1350"/>

    <rect class="node" x="1025" y="195" width="170" height="44"/>
    <text class="label center" x="1110" y="217">W↓ · 7168 → 3584</text>
    <path class="line" d="M1110 159 V195"/>

    <rect class="node-soft" x="1220" y="190" width="255" height="64"/>
    <text class="small center" x="1347.5" y="211">selected routed experts</text>
    <text class="tiny center" x="1347.5" y="235">SiTU-GLU · 3584 → 3072 → 3584</text>
    <path class="line" d="M1195 217 H1220"/>
    <path class="line-dashed" d="M1412.5 159 V180 H1347.5 V190"/>

    <rect class="node" x="1495" y="195" width="120" height="44"/>
    <text class="small center" x="1555" y="217">weighted Σ</text>
    <path class="line" d="M1475 217 H1495"/>

    <rect class="node" x="1495" y="265" width="120" height="44"/>
    <text class="label center" x="1555" y="287">RMSNorm</text>
    <path class="line" d="M1555 239 V265"/>

    <rect class="node" x="1635" y="260" width="110" height="54"/>
    <text class="small center" x="1690" y="278">W↑ projection</text>
    <text class="tiny center" x="1690" y="298">3584 → 7168</text>
    <path class="line" d="M1615 287 H1635"/>

    <rect class="node" x="1220" y="320" width="255" height="54"/>
    <text class="small center" x="1347.5" y="338">2× shared experts · summed</text>
    <text class="tiny center" x="1347.5" y="358">7168 → 33792 → 7168</text>
    <path class="line" d="M1195 147 H1205 V347 H1220"/>

    <circle cx="1690" cy="340" r="18" fill="#D9392E" stroke="#111111" stroke-width="2"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1690" y="341">+</text>
    <path class="line" d="M1690 314 V322"/>
    <path class="line" d="M1475 347 H1645 V340 H1672"/>
    <path class="line" d="M1708 340 H1748"/>
  </g>

  <!-- Gated MLA -->
  <g aria-label="Gated MLA">
    <rect class="panel" x="1005" y="430" width="760" height="445"/>
    <text class="title left" x="1025" y="460">Gated MLA · global attention</text>
    <text class="tiny left" x="1025" y="486">24 layers · 96 heads · NoPE · full-rank channel-wise output gate</text>

    <path class="line" d="M1385 580 V557"/>
    <rect class="node" x="1245" y="515" width="280" height="42"/>
    <text class="label center" x="1385" y="536">sigmoid output gate → Linear O</text>

    <rect class="node-accent" x="1225" y="580" width="320" height="54"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1385" y="602">Global multi-head attention</text>
    <text class="label-white center" style="fill:#F5F1EA" x="1385" y="620">global content interaction</text>

    <rect class="node-soft" x="1080" y="660" width="220" height="54"/>
    <rect class="node-soft" x="1470" y="660" width="220" height="54"/>
    <text class="small center" x="1190" y="681">Q · 96 × 128</text>
    <text class="tiny center" x="1190" y="700">content-only, NoPE</text>
    <text class="small center" x="1580" y="681">K / V · 96 × 128</text>
    <text class="tiny center" x="1580" y="700">latent KV cache</text>
    <path class="line" d="M1190 660 V607 H1225"/>
    <path class="line" d="M1580 660 V607 H1545"/>

    <rect class="node" x="1080" y="735" width="220" height="54"/>
    <rect class="node" x="1470" y="735" width="220" height="54"/>
    <text class="label center" x="1190" y="756">Q down / up projection</text>
    <text class="tiny center" x="1190" y="775">q LoRA rank 1536</text>
    <text class="label center" x="1580" y="756">KV down / up projection</text>
    <text class="tiny center" x="1580" y="775">kv LoRA rank 512</text>
    <path class="line" d="M1190 735 V714"/>
    <path class="line" d="M1580 735 V714"/>

    <rect class="node-dark" x="1260" y="810" width="250" height="44"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1385" y="832">input · 7168</text>
    <path class="line-plain" d="M1385 810 V775"/>
    <circle cx="1385" cy="775" r="4" fill="#111111"/>
    <path class="line" d="M1385 775 H1300"/>
    <path class="line" d="M1385 775 H1470"/>
    <path class="line-dashed" d="M1510 832 H1720 V536 H1525"/>
  </g>

  <!-- Vision pathway -->
  <g aria-label="MoonViT-V2 vision pathway">
    <line class="divider" x1="35" y1="910" x2="1765" y2="910"/>
    <text class="title left" x="55" y="945">Native vision pathway · MoonViT-V2</text>
    <text class="tiny left" x="55" y="971">401M parameters · trained from scratch with next-token prediction · shared image/video parameters</text>

    <rect class="panel" x="35" y="995" width="1730" height="420"/>

    <rect class="node-accent" x="70" y="1165" width="165" height="58"/>
    <text class="label-white center" style="fill:#F5F1EA" x="152.5" y="1185">images / video</text>
    <text class="label-white center" style="fill:#F5F1EA" x="152.5" y="1205">frames</text>
    <path class="line" d="M235 1194 H280"/>

    <rect class="node" x="280" y="1165" width="165" height="58"/>
    <text class="label center" x="362.5" y="1185">patch embed</text>
    <text class="tiny center" x="362.5" y="1205">patch size 14</text>
    <path class="line" d="M445 1194 H525 V1153 H555"/>

    <rect class="panel-subtle" x="495" y="1035" width="390" height="320"/>
    <text class="number left" x="515" y="1065">27× vision blocks</text>
    <text class="tiny left" x="515" y="1090">hidden 1024 · intermediate 4096 · 12 heads</text>

    <rect class="node" x="555" y="1130" width="270" height="46"/>
    <text class="label center" x="690" y="1153">factorized spatial attention</text>
    <path class="line" d="M690 1176 V1205"/>
    <rect class="node" x="555" y="1205" width="270" height="46"/>
    <text class="label center" x="690" y="1228">temporal pass + pooling</text>
    <path class="line" d="M690 1251 V1280"/>
    <rect class="node" x="555" y="1280" width="270" height="46"/>
    <text class="label center" x="690" y="1303">RMSNorm + MLP</text>
    <path class="line-dashed" d="M825 1303 H850 V1153 H825"/>

    <path class="line" d="M690 1326 V1340 H900 V1194 H930"/>
    <rect class="node-accent" x="930" y="1155" width="190" height="78"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1025" y="1180">2×2 pixel shuffle</text>
    <text class="label-white center" style="fill:#F5F1EA" x="1025" y="1202">visual tokens ÷ 4</text>

    <path class="line" d="M1120 1194 H1170"/>
    <rect class="node" x="1170" y="1145" width="210" height="98"/>
    <text class="label center" x="1275" y="1170">PatchMergerV2</text>
    <text class="small center" x="1275" y="1194">MLP projector</text>
    <text class="tiny center" x="1275" y="1218">1024 → 7168</text>

    <path class="line" d="M1380 1194 H1435"/>
    <rect class="node-dark" x="1420" y="1145" width="290" height="98"/>
    <text class="label-white center" style="fill:#F5F1EA" x="1565" y="1172">merge with text tokens</text>
    <text class="label-white center" style="fill:#F5F1EA" x="1565" y="1196">shared embedding space</text>
    <text class="label-white center" style="fill:#F5F1EA" x="1565" y="1220">hidden 7168</text>

    <path class="line" d="M1565 1145 V1035 H760 V875"/>
  </g>
</svg>
